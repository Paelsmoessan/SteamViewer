name: "SonarCloud"

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    name: SonarCloud
    runs-on: windows-latest
    timeout-minutes: 30
    # Skip if SONAR_TOKEN secret isn't configured (e.g. private repo without paid tier).
    # The whole workflow no-ops cleanly instead of failing red.
    if: ${{ vars.SONAR_ENABLED == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full clone needed for SonarCloud's blame analysis ("new code" detection).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Download FFmpeg DLLs
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          $extract = "$env:RUNNER_TEMP\ffmpeg"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $binDir = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          $dest = "src/SteamViewer.App/ffmpeg"
          New-Item -ItemType Directory -Path $dest -Force
          Copy-Item "$($binDir.FullName)/bin/avcodec-62.dll" $dest
          Copy-Item "$($binDir.FullName)/bin/avutil-60.dll" $dest
          Copy-Item "$($binDir.FullName)/bin/swscale-9.dll" $dest
          Copy-Item "$($binDir.FullName)/bin/swresample-6.dll" $dest

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          # Project key follows SonarCloud's GitHub-import convention.
          # Owner key is lowercased on SonarCloud; repo key keeps GitHub casing.
          $orgKey = "${{ github.repository_owner }}".ToLower()
          $projectKey = "${{ github.repository_owner }}_${{ github.event.repository.name }}"

          .\.sonar\scanner\dotnet-sonarscanner begin `
            /k:"$projectKey" `
            /o:"$orgKey" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.cs.roslyn.ignoreIssues=false

          dotnet build SteamViewer.Windows.sln -c Release

          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
