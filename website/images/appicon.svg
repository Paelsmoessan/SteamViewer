<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Steam gradient -->
    <linearGradient id="steamGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#7B9AAD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8CCD8;stop-opacity:0.6" />
    </linearGradient>
    <!-- Monitor gradient -->
    <linearGradient id="monitorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF" />
      <stop offset="100%" style="stop-color:#00A8CC" />
    </linearGradient>
    <!-- Screen gradient (darker) -->
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#006080" />
      <stop offset="100%" style="stop-color:#004060" />
    </linearGradient>
  </defs>

  <!-- Background (optional - can be removed for transparency) -->
  <rect width="128" height="128" fill="#0A1929" rx="16"/>

  <!-- Steam bubbles -->
  <circle cx="64" cy="18" r="8" fill="url(#steamGradient)" opacity="0.9"/>
  <circle cx="52" cy="28" r="6" fill="url(#steamGradient)" opacity="0.8"/>
  <circle cx="76" cy="26" r="7" fill="url(#steamGradient)" opacity="0.85"/>
  <circle cx="58" cy="10" r="5" fill="url(#steamGradient)" opacity="0.7"/>
  <circle cx="72" cy="12" r="4" fill="url(#steamGradient)" opacity="0.65"/>
  <circle cx="48" cy="16" r="4" fill="url(#steamGradient)" opacity="0.6"/>
  <circle cx="80" cy="18" r="3" fill="url(#steamGradient)" opacity="0.55"/>

  <!-- Left Monitor -->
  <g transform="translate(12, 42)">
    <!-- Monitor frame -->
    <rect x="0" y="0" width="42" height="34" rx="3" fill="url(#monitorGradient)"/>
    <!-- Screen -->
    <rect x="3" y="3" width="36" height="24" rx="2" fill="url(#screenGradient)"/>
    <!-- Stand -->
    <rect x="16" y="34" width="10" height="6" fill="url(#monitorGradient)"/>
    <rect x="12" y="40" width="18" height="3" rx="1" fill="url(#monitorGradient)"/>
    <!-- Arrow pointing right (inside screen) -->
    <path d="M12 15 L28 15 L28 10 L38 15 L28 20 L28 15" fill="#00D4FF" opacity="0.9"/>
  </g>

  <!-- Right Monitor -->
  <g transform="translate(74, 42)">
    <!-- Monitor frame -->
    <rect x="0" y="0" width="42" height="34" rx="3" fill="url(#monitorGradient)"/>
    <!-- Screen -->
    <rect x="3" y="3" width="36" height="24" rx="2" fill="url(#screenGradient)"/>
    <!-- Stand -->
    <rect x="16" y="34" width="10" height="6" fill="url(#monitorGradient)"/>
    <rect x="12" y="40" width="18" height="3" rx="1" fill="url(#monitorGradient)"/>
    <!-- Arrow pointing left (inside screen) -->
    <path d="M30 15 L14 15 L14 10 L4 15 L14 20 L14 15" fill="#00D4FF" opacity="0.9"/>
  </g>

  <!-- Connection arrows between monitors -->
  <g transform="translate(54, 52)">
    <!-- Right arrow -->
    <path d="M0 8 L10 8 L10 5 L16 10 L10 15 L10 12 L0 12 Z" fill="#00D4FF"/>
    <!-- Left arrow -->
    <path d="M20 8 L10 8 L10 5 L4 10 L10 15 L10 12 L20 12 Z" fill="#00D4FF" transform="translate(0, 12)"/>
  </g>
</svg>
