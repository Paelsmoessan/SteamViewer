# Coturn TURN Server Configuration for SteamViewer.NET
# Optimized for Railway (TCP only)

# Network settings - Railway provides PORT env var
listening-port=3478

# Use fingerprint in TURN messages
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Static user credentials
user=steamviewer:SteamViewer2026SecureRelay!

# Realm
realm=steamviewer.net

# Logging
verbose
log-file=stdout

# No CLI (not needed in container)
no-cli

# Security settings
no-multicast-peers
no-loopback-peers

# TCP relay only (Railway doesn't support UDP)
# This works but has slightly higher latency than UDP
no-udp
no-dtls

# Relay ports - Railway maps these internally
min-port=49152
max-port=49162

# Quota settings
total-quota=100
bps-capacity=0
stale-nonce=600
