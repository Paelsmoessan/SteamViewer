# Coturn TURN Server Configuration for SteamViewer.NET
# Deployed on Railway

# Network settings
listening-port=3478
tls-listening-port=5349

# Use fingerprint in TURN messages
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Static user credentials
# Format: user=username:password
user=steamviewer:SteamViewer2026SecureRelay!

# Realm - use your domain
realm=steamviewer.net

# Logging
verbose
log-file=stdout

# No CLI (not needed in container)
no-cli

# Security settings
no-multicast-peers
no-loopback-peers

# Relay settings - limit ports for Railway
min-port=49152
max-port=49252

# Quota settings (prevent abuse)
total-quota=100
bps-capacity=0
stale-nonce=600

# Allow localhost for testing
# Remove in production if not needed
# no-tcp-relay
